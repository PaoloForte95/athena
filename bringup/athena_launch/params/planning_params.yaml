bt_planner:
  ros__parameters:
    groot_port: 1668
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    bt_package_dir: 'athena_behavior_tree'
    #behavior_tree: 'generation_and_planning.xml'
    behavior_tree: 'problem_generation_w_planning_w_dispatching.xml'
    plugin_lib_names:
    - athena_recovery_node_bt_node
    - athena_rate_controller_bt_node
    - athena_compute_plan_action_bt_node
    - athena_execute_plan_node_bt_node
    - athena_update_state_action_bt_node
    - athena_generate_problem_file_action_bt_node
    - athena_update_prompt_action_bt_node
    - athena_detect_objects_action_bt_node
    - athena_updated_prompt_controller_bt_node
    - athena_pipeline_sequence_bt_node
    - athena_all_object_detected_condition_node
    - athena_check_problem_file_condition_node
    - athena_dispatcher_node_bt_node
    - athena_send_move_action_bt_node
    - athena_send_load_action_bt_node
    - athena_send_dump_action_bt_node
    - athena_generate_domain_file_action_bt_node

task_planner_server:
 ros__parameters:
    use_sim_time: True
    planner_frequency: 3.0
    definitions:
      robot: "/home/pofe/planning_ws/src/athena/bringup/robot_definitions.yaml"
      location: "/home/pofe/planning_ws/src/athena/bringup/location_definitions.yaml"
      object: "/home/pofe/planning_ws/src/athena/bringup/object_definitions.yaml"
      movement: "/home/pofe/planning_ws/src/athena/bringup/movement_definitions.yaml"
      plan_filename: "plan.pddl"
      proto_filename: "ExePlan.data"
    optimization:
      enabled: True
      paths_filename: "/home/pofe/planning_ws/src/athena/bringup/path_costs.csv"
      time_limit: 10.0
      max_attempts: 10
      time_scale: 10.0
      action_duration: 5.0
      weight:
        makespan: 1.0
        travel: 0.1
        assignment: 0.0
        change: 0.001
      speed:
        default: 1.0
        robots: ["robot1", "robot2"]
        values: [1.0, 2.0]
    planner_plugins: [ "FD"]
    FD:
      plugin: "athena_planner::FastDownward"
      search: "astar(blind())"
